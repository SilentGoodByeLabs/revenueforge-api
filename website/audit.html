<!DOCTYPE html><html lang="en"><head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Free Revenue Audit | RevenueForge</title><link rel="icon" type="image/png" href="assets/logo.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css">
<style>.audit-card{max-width:760px;margin:0 auto}.score{display:inline-block;background:#DCFCE7;color:#15803D;font-weight:800;border-radius:8px;padding:2px 10px;margin-left:8px}.a-job{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}</style></head>
<body><div id="header"></div>
<section class="page-hero"><div class="container"><h1>Free Revenue Audit</h1><p>See the jobs and opportunities our engine finds for you — before you pay a cent.</p></div></section>
<section class="section"><div class="container audit-card"><div class="card">
<label style="font-size:13px;font-weight:700">Your skills</label>
<input id="au_skills" placeholder="e.g. Python, OCR, data entry automation">
<label style="font-size:13px;font-weight:700">Your target customers</label>
<input id="au_target" placeholder="e.g. accounting firms, e-commerce brands">
<button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="runAudit()"><i class="fa-solid fa-magnifying-glass-chart"></i> Run my free audit</button>
</div>
<div id="au_out" style="margin-top:20px"></div>
</div></section><div id="footer"></div>
<script src="js/config.js?v=4"></script><script src="js/layout.js?v=11"></script>
<script>
function runAudit(){
  var API=window.RF_API||'';
  var out=document.getElementById('au_out');
  out.innerHTML='<p style="color:var(--muted)">Scanning live job feeds…</p>';
  var sess=null;try{sess=JSON.parse(localStorage.getItem('rf_session')||'null');}catch(e){}
  var sess=null;try{sess=JSON.parse(localStorage.getItem('rf_session')||'null');}catch(e){}
  fetch(API+'/api/audit?skills='+encodeURIComponent(document.getElementById('au_skills').value)+'&target='+encodeURIComponent(document.getElementById('au_target').value)+(sess&&sess.email?'&member='+encodeURIComponent(sess.email):''))
  .then(function(r){return r.json();}).then(function(d){
    if(d.used){ out.innerHTML='<div class="card" style="text-align:center"><h3>Free audit already used on this network</h3><p style="color:var(--muted)">Create a free verified account to unlock unlimited audits.</p><a class="btn btn-primary" href="signup.html">Create account</a></div>'; return; }
    var h='<h3 style="margin-bottom:12px"><i class="fa-solid fa-briefcase"></i> Top matches for you right now</h3>';
    if(!d.jobs||!d.jobs.length) h+='<p style="color:var(--muted)">The radar is warming up — create a free account and it will scan for you every 30 minutes.</p>';
    d.jobs.forEach(function(j){ h+='<div class="a-job"><strong>'+j.title+'</strong><span class="score">'+j.score+'% match</span><br><span style="color:var(--muted);font-size:13px">'+(j.platform||'')+'</span><br><a style="color:var(--accent)" href="'+j.url+'" target="_blank">View job →</a></div>'; });
    h+='<h3 style="margin:18px 0 10px"><i class="fa-solid fa-boxes-stacked"></i> Services you could sell</h3>';
    d.products.forEach(function(p){ h+='<div class="a-job"><strong>'+p.name+'</strong> — $'+p.price+'</div>'; });
    h+='<div class="card" style="margin-top:16px;text-align:center"><h3>Want this on autopilot?</h3><p style="color:var(--muted)">Create a free account and let the robot work for you.</p><a class="btn btn-primary" href="signup.html">Create free account</a> <a class="btn btn-ghost" href="pricing.html">See packages</a></div>';
    out.innerHTML=h;
  }).catch(function(){ out.innerHTML='<p style="color:#B91C1C">Server waking up — try again in 20 seconds.</p>'; });
}
</script></body></html>
