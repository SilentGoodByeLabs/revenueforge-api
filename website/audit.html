<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Free Audit — RevenueForge</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter;background:#F4F6FA;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;padding:32px;width:min(560px,92vw)}h1{font-family:Sora;font-size:1.4rem;margin:0 0 6px}
input{width:100%;padding:12px;border:1.5px solid #E2E8F0;border-radius:10px;margin-top:12px;font-size:14px}
button{width:100%;margin-top:14px;background:#2563EB;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}
.muted{color:#64748B;font-size:.88rem}.row{padding:10px 0;border-bottom:1px solid #E2E8F0;font-size:.9rem}
</style></head><body>
<div class="card"><h1>Free Job Audit</h1><p class="muted">See who is hiring for your skills right now.</p>
<input id="sk" placeholder="your skills / work type">
<button id="go">Run my audit</button>
<div id="out" style="margin-top:16px"></div></div>
<script>
var API='https://revenueforge-api.onrender.com';
var sess={};try{sess=JSON.parse(sessionStorage.getItem('rf_session')||'{}');}catch(e){}
if(!sess.email){alert('Create your free account first, then run your audit.');location.href='signup.html';}
document.getElementById('go').addEventListener('click',function(){
 var q=document.getElementById('sk').value||'hiring';
 document.getElementById('out').innerHTML='<p class="muted">Searching 30+ sources…</p>';
 fetch(API+'/api/search-hiring?q='+encodeURIComponent(q)+'&limit=8&email='+encodeURIComponent(sess.email))
  .then(function(r){return r.json();}).then(function(d){
    if(!d.ok){document.getElementById('out').innerHTML='<p class="muted">'+(d.error==='trial_expired'?'Your free trial has ended — upgrade to keep auditing.':'No matches. Try different skills.')+'</p>';return;}
    var rs=d.results||[];
    document.getElementById('out').innerHTML=rs.length?rs.map(function(r){return '<div class="row"><b>'+r.title+'</b><br><span class="muted">'+r.platform+' · '+r.score+'%</span></div>';}).join(''):'<p class="muted">No matches. Try different skills.</p>';
  }).catch(function(){document.getElementById('out').innerHTML='<p class="muted">Search error.</p>';});
});
</script></body></html>
