<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign up — RevenueForge</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Inter,sans-serif;background:radial-gradient(1000px 500px at 50% -10%,#1D4E75,#0B2239);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;padding:36px;width:min(400px,92vw)}h1{font-family:Sora;margin:0 0 4px}h1 b{color:#2563EB}
.caption{color:#64748B;margin:0 0 20px;font-size:.95rem}
input{width:100%;padding:12px;border:1.5px solid #E2E8F0;border-radius:10px;margin-top:12px;font-size:14px}
button{width:100%;margin-top:16px;background:#2563EB;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}
a{color:#2563EB}</style></head><body>
<div class="card"><h1>Revenue<b>Forge</b></h1><p class="caption">Create your account</p>
<form id="f"><input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Password" required><button>Sign up</button></form>
<p style="color:#64748B;font-size:.85rem;margin-top:14px">Have an account? <a href="login.html">Log in</a></p></div>
<script>
var API='https://revenueforge-api.onrender.com';
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();
 var em=document.getElementById('em').value;
 var fd=new URLSearchParams();fd.append('email',em);fd.append('password',document.getElementById('pw').value);fd.append('captcha','skip');
 function fin(){sessionStorage.setItem('rf_session',JSON.stringify({email:em}));location.href='portal.html?authed='+encodeURIComponent(em);}
 fetch(API+'/api/join-form',{method:'POST',body:fd,redirect:'manual'}).then(fin).catch(fin);
});
</script></body></html>
