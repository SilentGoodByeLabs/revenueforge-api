<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Log In | RevenueForge</title><link rel="icon" type="image/png" href="assets/logo.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>.auth-sec{min-height:calc(100vh - 140px);display:flex;align-items:center;padding:40px 16px}.auth-card{max-width:460px;margin:0 auto;border-radius:20px;background:#fff;box-shadow:0 24px 60px rgba(11,34,57,.18);padding:40px 32px}.auth-card h1{font-family:'Sora';font-size:1.5rem;text-align:center}.auth-card .sub{color:var(--muted);font-size:.92rem;margin:6px 0 22px;text-align:center}.auth-card label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.auth-card input{width:100%;margin:6px 0 14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}.auth-card input:focus{outline:none;border-color:var(--accent)}.g-recaptcha{margin:6px 0 14px}.auth-card .btn{width:100%;padding:13px;font-size:1rem;border-radius:12px}.auth-card .alt{margin-top:14px;font-size:13.5px;color:var(--muted);text-align:center}@media (max-width:520px){.auth-card{padding:30px 20px}}</style></head><body><div id="header"></div>
<section class="auth-sec"><div class="auth-card">
  <h1>Welcome back</h1>
  <p class="sub">Log in with your email.</p>
  <form id="liForm" method="get" action="https://revenueforge-api.onrender.com/api/login-get">
    <label>Email</label>
    <input name="email" id="li_email" type="email" autocomplete="username" required>
    <label>Password</label>
    <input name="password" id="li_pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
    <label>Human verification</label>
    <div class="g-recaptcha" data-sitekey="6Lc-5ogtAAAAALRP2NOwo5mPU0MUf1MITyOAwJW4"></div>
    <p id="li_msg" style="color:#B91C1C;min-height:20px;font-size:13.5px"></p>
    <button class="btn btn-primary" type="submit">Log in →</button>
  </form>
  <p class="alt">New here? <a href="register.html">Create a free account</a></p>
</div></section><div id="footer"></div>
<script src="js/config.js"></script><script src="js/layout.js"></script><script src="js/auth.js"></script></body></html>
